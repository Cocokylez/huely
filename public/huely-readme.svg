<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Huely — Paint it for real</title>
  <desc id="description">A warm atelier-inspired banner showing a canvas reference, extracted color palette, and paint-mixing recipe.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf2"/>
      <stop offset="1" stop-color="#eee3d2"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e98b68"/>
      <stop offset="1" stop-color="#bd5132"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fb4aa"/>
      <stop offset="1" stop-color="#2f6f6a"/>
    </linearGradient>
    <linearGradient id="painting" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#294c55"/>
      <stop offset="0.43" stop-color="#6a8677"/>
      <stop offset="0.7" stop-color="#d5a268"/>
      <stop offset="1" stop-color="#9f4f38"/>
    </linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#fff" stroke-opacity=".42" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#463528" flood-opacity=".16"/>
    </filter>
    <clipPath id="artClip">
      <rect x="765" y="54" width="300" height="226" rx="22"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="418" rx="34" fill="url(#paper)" stroke="#d8cab5" stroke-width="2"/>
  <circle cx="111" cy="62" r="170" fill="#e6b8a6" opacity=".2"/>
  <circle cx="1090" cy="374" r="210" fill="#4fa39b" opacity=".11"/>
  <path d="M0 355C205 301 322 441 510 386S806 302 1200 363V420H0Z" fill="#fffdf9" opacity=".5"/>

  <g transform="translate(76 68)">
    <g transform="translate(0 2)">
      <rect width="66" height="66" rx="22" fill="#2b2723"/>
      <circle cx="24" cy="24" r="11" fill="#e07a55"/>
      <circle cx="43" cy="24" r="11" fill="#4fa39b"/>
      <circle cx="33.5" cy="43" r="11" fill="#e3b46f"/>
      <circle cx="33.5" cy="30.5" r="7" fill="#f4efe6"/>
    </g>
    <text x="88" y="50" fill="#2b2723" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="760" letter-spacing="-3">Huely</text>
    <text x="2" y="119" fill="#2b2723" font-family="Georgia, ui-serif, serif" font-size="34" font-weight="600">Paint it for real.</text>
    <text x="2" y="158" fill="#6b635a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19">Turn any photo into a canvas-ready painting plan,</text>
    <text x="2" y="187" fill="#6b635a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19">exact palette, and beginner-friendly color recipes.</text>

    <g transform="translate(0 228)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">
      <rect width="144" height="42" rx="21" fill="#c65d3b"/>
      <text x="72" y="26" fill="#fff" text-anchor="middle">PHOTO → CANVAS</text>
      <rect x="156" width="126" height="42" rx="21" fill="#fffdf9" stroke="#d8cab5"/>
      <text x="219" y="26" fill="#2f6f6a" text-anchor="middle">PRIVATE FIRST</text>
      <rect x="294" width="104" height="42" rx="21" fill="#fffdf9" stroke="#d8cab5"/>
      <text x="346" y="26" fill="#6b635a" text-anchor="middle">INSTALLABLE</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="733" y="31" width="364" height="300" rx="30" fill="#fffdf9" stroke="#d8cab5"/>
    <g clip-path="url(#artClip)">
      <rect x="765" y="54" width="300" height="226" fill="url(#painting)"/>
      <path d="M745 217C827 145 851 185 921 120S1013 71 1084 118V280H745Z" fill="#d8ad73" opacity=".88"/>
      <path d="M746 245C822 197 900 267 970 207S1038 162 1090 177V290H746Z" fill="#a6533d" opacity=".86"/>
      <circle cx="999" cy="97" r="32" fill="#f1d69b" opacity=".82"/>
      <rect x="765" y="54" width="300" height="226" fill="url(#grid)"/>
    </g>
    <rect x="765" y="54" width="300" height="226" rx="22" fill="none" stroke="#2b2723" stroke-opacity=".18"/>
    <rect x="785" y="73" width="86" height="28" rx="14" fill="#201d1a" fill-opacity=".68"/>
    <text x="828" y="92" fill="#fff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" text-anchor="middle">8 × 10 in</text>

    <g transform="translate(765 295)">
      <rect width="48" height="12" rx="6" fill="#294c55"/>
      <rect x="42" width="48" height="12" rx="6" fill="#6a8677"/>
      <rect x="84" width="48" height="12" rx="6" fill="#d5a268"/>
      <rect x="126" width="48" height="12" rx="6" fill="#9f4f38"/>
      <rect x="168" width="48" height="12" rx="6" fill="#e8caa1"/>
      <text x="300" y="11" fill="#6b635a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" text-anchor="end">12 colors</text>
    </g>
  </g>

  <g transform="translate(872 292)" filter="url(#shadow)">
    <rect width="244" height="84" rx="22" fill="#2b2723"/>
    <text x="22" y="26" fill="#bdb1a0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">PAINT RECIPE</text>
    <circle cx="31" cy="55" r="13" fill="#315b78"/>
    <text x="53" y="60" fill="#f4efe6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">2 blue</text>
    <text x="107" y="60" fill="#bdb1a0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">+</text>
    <circle cx="135" cy="55" r="13" fill="#d5a268"/>
    <text x="157" y="60" fill="#f4efe6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">1 ochre</text>
  </g>
</svg>
